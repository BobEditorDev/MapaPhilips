<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas do Mezanino - Mapa do Escritório Philips</title>
    <link rel="stylesheet" href="terreo-salas.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="philips-logo">PHILIPS</div>
            <h1>Salas do Mezanino</h1>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">📍 Térreo</a>
                <a href="mezanino.html" class="nav-link active">🏢 Mezanino</a>
                <a href="coordenadas.html" class="nav-link">🔧 Coordenadas</a>
                <a href="https://github.com/BobEditorDev/MapaPhilips" target="_blank" rel="noopener noreferrer" class="repo-btn" title="Ver repositório no GitHub">
                    📁 Repositório
                </a>
            </nav>
        </header>
        
        <main class="main-content">
            <!-- Rooms Sidebar -->
            <aside class="rooms-panel">
                <div class="search-section">
                    <h2>Buscar Sala</h2>
                    <div class="search-input-wrapper">
                        <input type="text" id="room-search" class="search-input" placeholder="Digite o nome, código ou nº de pessoas...">
                    </div>
                    <div id="rooms-count" class="search-results-count"></div>
                </div>
                
                <div class="rooms-list">
                    <h2>Lista de Salas</h2>
                    <div id="rooms-container" class="rooms-container">
                        <!-- Salas serão inseridas via JavaScript -->
                    </div>
                </div>
                
                <div class="room-info">
                    <h2>Informações</h2>
                    <div id="room-details" class="room-details">
                        <p class="info-message">Selecione uma sala para ver suas informações</p>
                    </div>
                </div>
            </aside>
            
            <!-- Floor Plan Map -->
            <section class="map-container">
                <div class="map-wrapper" id="map-wrapper">
                    <div class="map-inner" id="map-inner">
                        <img id="floor-plan" src="Mesanino.png" alt="Planta Baixa do Mezanino" draggable="false">
                        <div id="rooms-overlay" class="rooms-overlay"></div>
                    </div>
                </div>
                <div class="map-footer">
                    <span id="instruction-text" class="instruction-text">Clique em uma sala da lista para destacar sua localização</span>
                    <div class="map-controls">
                        <button id="zoom-out-btn" class="control-btn zoom-btn" title="Diminuir zoom (Ctrl+Scroll)">−</button>
                        <span id="zoom-level" class="zoom-level-display">100%</span>
                        <button id="zoom-in-btn" class="control-btn zoom-btn" title="Aumentar zoom (Ctrl+Scroll)">+</button>
                        <button id="zoom-reset-btn" class="control-btn zoom-btn" title="Resetar zoom">⊙</button>
                        <button id="show-all-btn" class="control-btn">Todas</button>
                        <button id="hide-all-btn" class="control-btn">Ocultar</button>
                        <button id="share-location-btn" class="control-btn share-btn" title="Clique para selecionar um ponto no mapa e copiar o link de compartilhamento" onclick="if(window.mezaninoRooms){window.mezaninoRooms.toggleShareMode();}else{console.error('[share] window.mezaninoRooms não disponível');}">📍 Compartilhar local</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- Global Footer -->
    <footer class="global-footer">
        <div class="footer-content">
            Desenvolvido por <span class="developer">Rodrigo Schmitt</span> • 
            <span class="copilot">100% com GitHub Copilot</span>
        </div>
    </footer>
    
    <script src="mezanino.js"></script>
    <script src="mezanino-pontos-fixos.js"></script>
    <script src="visit-counter.js"></script>
</body>
</html>
